services:
  qdrant:
    image: "docker.io/qdrant/qdrant:v1.16.3"
    hostname: qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  nevis:
    image: "localhost/nevis_test:latest"
    depends_on:
      - qdrant
    hostname: nevis
    container_name: nevis
    ports:
      - "8000:8000"
